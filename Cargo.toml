[workspace]
resolver = "2"
members = [
    "crates/cutpilot-core",
    "crates/cutpilot-media",
    "crates/cutpilot-engine",
    "crates/cutpilot-mcp",
    "crates/cutpilot-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Barry Deen"]
repository = "https://github.com/barrydeen/cutpilot"
homepage = "https://github.com/barrydeen/cutpilot"
keywords = ["video-editor", "mcp", "ai-agent", "ffmpeg", "rust"]
categories = ["multimedia::video", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
cutpilot-core = { path = "crates/cutpilot-core" }
cutpilot-media = { path = "crates/cutpilot-media" }
cutpilot-engine = { path = "crates/cutpilot-engine" }

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "openprem-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openprem-mcp"
path = "src/main.rs"

[dependencies]
openprem-core.workspace = true
openprem-media.workspace = true
openprem-engine.workspace = true
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "time"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
base64 = "0.23"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[package]
name = "cutpilot-mcp"
description = "Stdio Model Context Protocol (MCP) server exposing CutPilot's full video editing command registry to AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "cutpilot-mcp"
path = "src/main.rs"

[dependencies]
cutpilot-core.workspace = true
cutpilot-media.workspace = true
cutpilot-engine.workspace = true
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "time"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
base64 = "0.23"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
